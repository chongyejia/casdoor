name: Fork source build (no publish)

on:
  push:
    branches:
      - codex/casdoor-fork-v4.13.0-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-source-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-build:
    if: github.repository == 'chongyejia/casdoor' && github.ref == 'refs/heads/codex/casdoor-fork-v4.13.0-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'Repository: %s\nSource commit: %s\nSource tree: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"

      - name: Use declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.8'
          cache: true

      - name: Compile and test changed identity packages
        shell: bash
        run: |
          set -euo pipefail
          go version
          go test ./idp -run '^TestLegacyLark' -count=1
          go test ./object -run '^Test(LarkMiniProgram|TypedLark|LegacyLark)' -count=1
          go build -p 2 ./...

      - name: Build local container image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 --target STANDARD \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "casdoor-source-check:${GITHUB_SHA}" .
          docker image inspect "casdoor-source-check:${GITHUB_SHA}" \
            --format 'Local image ID: {{.Id}}; revision label: {{index .Config.Labels "org.opencontainers.image.revision"}}'
